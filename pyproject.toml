[project]
name = "snsr"
version = "0.1.6"
description = "A simple random movement screensaver."
readme = "README.md"
license = "MIT"
authors = [{ name = "nichsedge" }]
requires-python = ">=3.9"
dependencies = [
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "jeepney>=0.8.0",
    "wakepy>=0.7.1",
]

[project.scripts]
snsr = "snsr.cli:run_screensaver"

[project.urls]
Homepage = "https://github.com/nichsedge/snsr"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["snsr"]
